name: 測試名片庫

on:
  push:
    branches: [main, cards-main]
  pull_request:
    branches: [main, cards-main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pytest
      - run: python -m pytest -q
