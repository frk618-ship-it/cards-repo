# 發布名片庫到 GitHub Pages。只在 main 分支執行:
# 在 cards-repo 裡 main 就是名片庫;在原本的 claude repo 裡這份檔案位於 cards-main 分支,不會觸發,不影響該 repo 的新聞網站。
name: 發布名片庫

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pytest
      - name: Test
        run: python -m pytest -q
      - name: Build
        run: |
          python -m card_scanner build -o public
          printf 'User-agent: *\nDisallow: /\n' > public/robots.txt
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
